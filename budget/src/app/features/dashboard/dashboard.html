<h1>Dashboard</h1>
<p class="text-muted">{{ statCount() }} stats</p>

<div class="row g-3 mt-1">
  @for (stat of stats(); track stat.label) {
    <div class="col-md-4">
      <app-card [title]="stat.label">
        <!--ngContent-->
        <p class="fs-4 mb-0">{{ stat.value }}</p>
        <!--ngContent-->
      </app-card>
    </div>
  }
</div>
